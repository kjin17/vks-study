# Istio Control Plane (istiod) - Production Tuned Values
# helm install istiod istio/istiod -n istio-system --version 1.24.2 -f istiod-values.yaml
pilot:
  # Control Plane 고가용성: 최소 2 replica
  replicaCount: 2
  autoscaleEnabled: true
  autoscaleMin: 2
  autoscaleMax: 5
  cpu:
    targetAverageUtilization: 80
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # 노드 드레인/업그레이드 시 최소 1개 유지
  podDisruptionBudget:
    minAvailable: 1
  env:
    # 사용하지 않는 프로토콜 스니핑 비활성화로 초기 연결 지연 감소 (선택)
    PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_OUTBOUND: "true"
    PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_INBOUND: "true"

global:
  proxy:
    # 사이드카 리소스 제한: OOM 방지 및 노드 리소스 보호
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 1Gi
    # 사이드카 준비 전 앱 컨테이너 시작 방지 (초기 요청 실패 예방)
    holdApplicationUntilProxyStarts: true
  # istiod 부하 감소: 디버그 로그 비활성화
  logging:
    level: "default:info"

meshConfig:
  # 액세스 로그 활성화 (표준 출력)
  accessLogFile: /dev/stdout
  # 메시 전체 기본 프록시 설정
  defaultConfig:
    # Envoy worker thread 수 제한 (기본: CPU 코어 수 → 메모리 과다 사용)
    concurrency: 2
    # 트레이싱 샘플링 1% (기본 100%는 운영 환경 오버헤드 큼)
    tracing:
      sampling: 1.0
    # 종료 시 커넥션 드레인 시간
    terminationDrainDuration: 30s
  # 정의되지 않은 외부 트래픽도 통과 허용 (엄격 제어 시 REGISTRY_ONLY)
  outboundTrafficPolicy:
    mode: ALLOW_ANY
