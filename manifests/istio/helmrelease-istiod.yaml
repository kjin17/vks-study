# Flux Helm Controller - istiod (Control Plane) 릴리스
# 버전 고정 + 실패 시 자동 remediation. values는 istiod-values.yaml의 튜닝 항목과 동일.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 10m
  dependsOn:
  - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.24.2"        # 버전 고정 (의도치 않은 업그레이드 방지)
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    pilot:
      replicaCount: 2
      autoscaleEnabled: true
      autoscaleMin: 2
      autoscaleMax: 5
      podDisruptionBudget:
        minAvailable: 1
    global:
      proxy:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 1Gi
        holdApplicationUntilProxyStarts: true
    meshConfig:
      accessLogFile: /dev/stdout
      defaultConfig:
        concurrency: 2
        tracing:
          sampling: 1.0
