# Istio Ingress Gateway - Production Tuned Values
# helm install istio-ingress istio/gateway -n istio-ingress --version 1.24.2 -f gateway-values.yaml
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2                      # 단일 장애점 제거
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

# 노드 드레인 시 최소 1개 유지
podDisruptionBudget:
  minAvailable: 1

service:
  type: LoadBalancer
  # 클라이언트 소스 IP 보존 (LoadBalancer 환경)
  externalTrafficPolicy: Local

# Gateway Pod를 서로 다른 노드에 분산 배치
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app: istio-ingress
        topologyKey: kubernetes.io/hostname
