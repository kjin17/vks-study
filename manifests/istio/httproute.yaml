# Kubernetes Gateway API - HTTPRoute 리소스
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-route
  namespace: demo
spec:
  parentRefs:
  - name: demo-gateway
  hostnames:
  - "httpbin.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: httpbin
      port: 8000
    # 가중치 기반 트래픽 분할 (Canary) 예시:
    # backendRefs:
    # - name: httpbin-v1
    #   port: 8000
    #   weight: 90
    # - name: httpbin-v2
    #   port: 8000
    #   weight: 10
