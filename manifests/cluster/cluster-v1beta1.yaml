# VKS 워크로드 클러스터 - Cluster v1beta1 API (ClusterClass 기반)
# 이 리소스를 apply 하면 VKS_CAPI_CAPV_Cluster_Provisioning_KR.md의 ②~⑧ 과정이 자동으로 진행됩니다.
# VKS 3.x(VCF 9.x)에서는 ClusterClass 이름으로 builtin-generic-v3.x.0 사용 (레거시 TKC API는 VKS 3.7에서 제거됨)
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: tkc-01
  namespace: pkyungjin-ns01          # 자신의 vSphere Namespace 사용
spec:
  clusterNetwork:
    services:
      cidrBlocks: ["10.96.0.0/12"]
    pods:
      cidrBlocks: ["192.168.0.0/16"]
    serviceDomain: cluster.local
  topology:
    class: tanzukubernetescluster    # Supervisor 내장 ClusterClass
    version: v1.27.5+vmware.1-fips.1-tkg.1   # k get tkr 로 사용 가능한 버전 확인
    controlPlane:
      replicas: 1                    # 운영: 3 (etcd 정족수)
    workers:
      machineDeployments:
      - class: node-pool
        name: node-pool-1
        replicas: 2
    variables:
    - name: vmClass
      value: best-effort-small       # k get vmclass 로 확인
    - name: storageClass
      value: pacific-storage-policy  # vSphere Namespace에 할당된 Storage Class
